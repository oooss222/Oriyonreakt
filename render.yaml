services:
  - type: web
    name: diyor-tj
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - diyor.tj
      - www.diyor.tj
      - oriyon.store
      - www.oriyon.store
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_BASE
        value: /api
      - key: CLIENT_URL
        value: https://diyor.tj
      - key: CORS_ORIGIN
        value: https://diyor.tj,https://www.diyor.tj,https://oriyon.store,https://www.oriyon.store,https://oriyonreakt-1.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
