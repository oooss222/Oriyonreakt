services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: diyor
      POSTGRES_PASSWORD: diyor
      POSTGRES_DB: diyor
    volumes:
      - diyor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diyor -d diyor"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://diyor:diyor@db:5432/diyor
      DATABASE_SSL: disable
      JWT_SECRET: diyor-docker-dev-secret-change-me-32ch
      ALLOW_LAN_ORIGINS: "true"
      CLIENT_URL: http://localhost:8080
      APP_URL: http://localhost:8080
      CORS_ORIGIN: http://localhost:8080,http://127.0.0.1:8080
      VITE_API_BASE: /api
      RLS_ENABLED: "true"
      PAYOMCHI_API_KEY: ${PAYOMCHI_API_KEY:-}
      PAYOMCHI_API_URL: ${PAYOMCHI_API_URL:-https://api.payomchi.tj}
      PAYOMCHI_SENDER_ID: ${PAYOMCHI_SENDER_ID:-}
    volumes:
      - diyor_uploads:/app/Server/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  diyor_pgdata:
  diyor_uploads:
